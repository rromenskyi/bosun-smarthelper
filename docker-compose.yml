services:
  bosun:
    build: .
    image: bosun-smarthelper:local
    container_name: bosun
    restart: unless-stopped
    # Host networking: Bosun is a LAN-only, no-auth personal appliance that
    # binds to an explicit private IP (see docs/local-deployment.md) and
    # needs to reach llama-chat/llama-embed at localhost:1234/1235. Bridge
    # networking would need port-mapping plus a host-gateway alias for zero
    # benefit on a single-host LAN box like this one.
    network_mode: host
    depends_on:
      - llama-chat
      - llama-embed
      - whisper-stt
    env_file:
      - .env
    volumes:
      - ./config.yaml:/etc/smarthelper/config.yaml:ro
      # A plain host directory, not a Docker-managed named volume — so
      # memos/documents/sessions survive `docker compose down -v` or
      # removing Docker entirely. Requires the container's bosun user to
      # be uid/gid 1000 (this host's own user) — see Dockerfile.
      - ./data/bosun:/home/bosun/.local/share/bosun
      # mkcert-issued cert/key for HTTPS (see docs/tls.md) — regenerate with
      # `mkcert -cert-file data/certs/cert.pem -key-file data/certs/key.pem
      # <lan-ip> <hostname> localhost 127.0.0.1 ::1` if the LAN IP changes.
      - ./data/certs:/home/bosun/certs:ro
      # Piper TTS voice model (docs/voice.md) — piper_exe/libpiper.so
      # themselves are baked into the image (see Dockerfile); only the
      # voice model is a runtime bind mount, so switching voices is a
      # config edit, not a rebuild.
      - ./data/models/tts:/home/bosun/models/tts:ro
    devices:
      # Real u-blox 7 GPS receiver (see internal/tools/gps_serial.go). If
      # another USB serial device ever gets added, this path may shift —
      # check `ls -la /dev/serial/by-id/` to find which /dev/ttyACMx it
      # actually is.
      - "/dev/ttyACM0:/dev/ttyACM0"
    group_add:
      # Matches this host's "dialout" group (GID 20) so the container's
      # non-root bosun user can open /dev/ttyACM0 (owned root:dialout,
      # mode 660) without loosening the device's own permissions.
      - "20"

  # See deploy/llama/Dockerfile for why this is built from source (pinned
  # commit, matching this host's already-verified bare-metal CPU-backend
  # flags) instead of the official ghcr.io/ggml-org/llama.cpp image.
  llama-chat:
    build: ./deploy/llama
    image: bosun-llama-cpp:local
    container_name: llama-chat
    restart: unless-stopped
    network_mode: host
    environment:
      - LLAMA_API_KEY=${LOCAL_LLM_API_KEY}
    volumes:
      - ${LLAMA_HF_CACHE}:/home/ubuntu/.cache/huggingface
    command: >-
      -hf mradermacher/gemma-4-E2B-it-GGUF:Q4_K_M
      --alias default --host 127.0.0.1 --port 1234
      -c 8192 -np 1 -t 4 --jinja --skip-chat-parsing --reasoning off

  llama-embed:
    build: ./deploy/llama
    image: bosun-llama-cpp:local
    container_name: llama-embed
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${LLAMA_HF_CACHE}:/home/ubuntu/.cache/huggingface
    # --sleep-idle-seconds: embeddings are only needed for occasional memo/
    # document writes and searches, not every chat turn — unlike llama-chat,
    # it's worth fully unloading this model (frees ~500MB RSS; confirmed via
    # manual test) after 5 minutes idle. Reload on the next request costs
    # ~2s, imperceptible for a background operation.
    command: >-
      -hf nomic-ai/nomic-embed-text-v2-moe-GGUF:Q8_0
      --alias embed --host 127.0.0.1 --port 1235
      --embeddings -c 512 -np 1 -t 2
      --sleep-idle-seconds 300

  # STT (docs/voice.md). See deploy/whisper/Dockerfile for why this is
  # built from source, same as llama-chat/llama-embed.
  whisper-stt:
    build: ./deploy/whisper
    image: bosun-whisper-cpp:local
    container_name: whisper-stt
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/models/whisper:/models:ro
    # --audio-ctx 512: whisper.cpp's encoder otherwise always processes a
    # fixed ~30s-equivalent window regardless of actual utterance length,
    # so a short push-to-talk command costs the same ~12-13s as a much
    # longer one on this CPU — confirmed by measurement, not assumption.
    # 512 cuts that to ~5s for both a 1.8s and a 5.3s test utterance, with
    # no accuracy loss on either in testing. Push-to-talk commands are
    # expected to be short; bump this (or drop it, 0 = full context) if
    # longer dictation-style input ever needs it.
    command: >-
      --model /models/ggml-tiny.bin
      --host 127.0.0.1 --port 1236
      --threads 4 --language ru --audio-ctx 512
